[package]
name = "agent-mcp-browser"
version = "1.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chromiumoxide = "0.9.1"
futures = "0.3.34"
ratatui = "0.30.2"
parking_lot = "0.12.5"
indexmap = "2.14.2"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["full"] }
crossterm = { version = "0.29", features = ["event-stream"] }
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
